name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, publish to Pages, and prove the deployment's identity.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in progress; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site is published only when lint and the automated tests pass.
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Public OAuth client ID (not a secret) that enables Google Drive synchronization.
          VITE_GOOGLE_CLIENT_ID: 89407035908-6pp4ha0p88q8t17371kao2brk3plhdfs.apps.googleusercontent.com
          # Public Supabase URL and publishable key (not secrets) for the AI suggestion Edge
          # Function. The Groq key is an Edge Function secret and is never here.
          VITE_SUPABASE_URL: https://ptavzqbgaamnnacgercs.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_YiZTDmi2KCtnQTEfgXIgqg_UmBRYSQV
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
